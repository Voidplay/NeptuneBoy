<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap (必须) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- Bootstrap Datepicker (核心) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <th:block th:include="include :: header('仓位管理，用于记录正股和期权的仓位详情列表')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>券商名称</label>
                            <input type="text" name="accountName"/>
                        </li>
                        <li>
                            <label>ticker</label>
                            <input type="text" name="tickerSymbol"/>
                        </li>
                        <li>
                            <label>成交日期</label>
                            <input type="text" class="time-input" placeholder="请选择交易日期" name="tradeDate"/>
                        </li>
                        <li>
                            <label>订单数量</label>
                            <input type="text" name="quantity"/>
                        </li>
                        <li>
                            <label>订单单价</label>
                            <input type="text" name="price"/>
                        </li>
                        <li>
                            <label>交易总价</label>
                            <input type="text" name="totalPrice"/>
                        </li>
                        <li>
                            <label>是否已平仓</label>
                            <input type="text" name="isClosed"/>
                        </li>
                        <li>
                            <label>期权策略</label>
                            <input type="text" name="optionStrategy"/>
                        </li>
                        <li>
                            <label>盈亏金额</label>
                            <input type="text" name="profitLoss"/>
                        </li>
                        <li>
                            <label>是否盈利</label>
                            <input type="text" name="isProfitable"/>
                        </li>
                        <li>
                            <label>平仓单价</label>
                            <input type="text" name="closingPrice"/>
                        </li>
                        <li>
                            <label>平仓总价</label>
                            <input type="text" name="closingTotalPrice"/>
                        </li>
                        <li>
                            <label>平仓日期</label>
                            <input type="text" class="time-input" placeholder="请选择平仓日期" name="closingDate"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:management:add">
                <i class="fa fa-plus"></i> 添加
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit()"
               shiro:hasPermission="system:management:edit">
                <i class="fa fa-edit"></i> 修改
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="system:management:remove">
                <i class="fa fa-remove"></i> 删除
            </a>
            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:management:export">
                <i class="fa fa-download"></i> 导出
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<!-- 平仓表单 -->
<div id="closePositionModal" class="modal fade" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">平仓</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="closePositionForm">
                    <input type="hidden" id="closePositionId" name="id">

                    <div class="form-group">
                        <label>是否已平仓</label>
                        <select id="isClosed" name="isClosed" class="form-control">
                            <option value="1">是</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>盈亏金额</label>
                        <input type="text" id="profitLoss" name="profitLoss" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>平仓单价</label>
                        <input type="text" id="closingPrice" name="closingPrice" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>平仓总价</label>
                        <input type="text" id="closingTotalPrice" name="closingTotalPrice" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>平仓日期</label>

                        <div class="input-group date" id="closingDatePicker">
                            <input type="text" id="closingDate" name="closingDate" class="form-control"
                                   placeholder="yyyy-MM-dd">
                            <div class="input-group-addon"><i class="fa fa-calendar"></i></div>
                        </div>

                    </div>


                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="submitCloseForm()">提交</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>


<th:block th:include="include :: footer"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
<script th:inline="javascript">


function openCloseModal(id) {
    $("#closePositionId").val(id); // 记录要平仓的仓位 ID
    $("#profitLoss").val('');
    $("#closingPrice").val('');
    $("#closingTotalPrice").val('');
    $("#closingDate").val('');
    $("#closePositionModal").modal('show'); // 确保 ID 匹配
}


        var editFlag = [[${@permission.hasPermi('system:management:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:management:remove')}]];
        var prefix = ctx + "system/management";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "新增仓位管理",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键ID',
                    visible: false
                },
                {
                    field: 'accountName',
                    title: '券商名称'
                },
                {
                    field: 'tradeType',
                    title: '交易类型'
                },
                {
                    field: 'tickerSymbol',
                    title: 'ticker'
                },
                {
                    field: 'tradeDate',
                    title: '交易日期'
                },
                {
                    field: 'tradeDirection',
                    title: '交易方向'
                },
                {
                    field: 'quantity',
                    title: '交易数量'
                },
                {
                    field: 'price',
                    title: '交易单价'
                },
                {
                    field: 'totalPrice',
                    title: '交易总价'
                },
                {
                    field: 'isClosed',
                    title: '是否已平仓',
                    formatter: function(value, row, index) {
                        return value == 1 ? '是' : '否';
                    }
                },
                {
                    field: 'optionStrategy',
                    title: '期权策略'
                },
                {
                    field: 'profitLoss',
                    title: '盈亏金额'
                },
                {
                    field: 'isProfitable',
                    title: '是否盈利'
                },
                {
                    field: 'closingPrice',
                    title: '平仓单价'
                },
                {
                    field: 'closingTotalPrice',
                    title: '平仓总价'
                },
                {
                    field: 'closingDate',
                    title: '平仓日期'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        // 只有未平仓的仓位才能平仓
                        actions.push('<a class="btn btn-info btn-xs" href="' + prefix + '/tradeAnalysis/' + row.id + '"><i class="fa fa-bar-chart"></i> 交易分析</a>');
                        if (row.isClosed == 0) {
                        actions.push('<a class="btn btn-warning btn-xs" href="javascript:void(0)" onclick="openCloseModal(\'' + row.id + '\')"><i class="fa fa-sign-out"></i> 平仓</a>');
                        }
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

function submitCloseForm() {
    var data = $("#closePositionForm").serialize(); // 序列化表单数据

    // 校验数据
    if (!$("#profitLoss").val() || !$("#closingPrice").val() || !$("#closingTotalPrice").val() || !$("#closingDate").val()) {
        alert("请填写完整的平仓信息！");
        return;
    }

    $.ajax({
        type: "POST",
        url: prefix + "/close",
        data: data,
        success: function(response) {
            if (response.code === 0) {
                alert("平仓成功！");
                $("#closePositionModal").modal('hide');
                $.table.refresh();
            } else {
                alert("平仓失败：" + response.msg);
            }
        }
    });
}



$(document).ready(function() {
    // 确保 bootstrap-datepicker 被正确加载
    if ($.fn.datepicker) {
        console.log("✅ bootstrap-datepicker 加载成功");
    } else {
        console.error("❌ bootstrap-datepicker 加载失败");
    }

    // 监听模态框打开事件，确保 Datepicker 被初始化
    $('#closePositionModal').on('shown.bs.modal', function () {
        $('#closingDatePicker').datepicker({
            format: 'yyyy-mm-dd',
            autoclose: true,
            todayHighlight: true,
            orientation: "bottom"
        }).datepicker('update', new Date()); // 默认填充当前日期
    });
});



</script>
</body>
</html>
