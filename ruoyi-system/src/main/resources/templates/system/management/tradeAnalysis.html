<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>交易分析</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        .nav-tabs { margin-bottom: 20px; }
        .tab-content { padding: 15px; border: 1px solid #ddd; border-top: none; }
        .analysis-display { border: 1px solid #ddd; padding: 15px; background: #f9f9f9; margin-bottom: 10px; }
        .analysis-edit { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>交易分析</h2>
    <input type="hidden" id="positionId" th:value="${positionId}" />

    <ul class="nav nav-tabs">
        <li class="active"><a data-toggle="tab" href="#openingReasonTab">开仓原因</a></li>
        <li><a data-toggle="tab" href="#holdingRecordTab">持仓时记录</a></li>
        <li><a data-toggle="tab" href="#closingReviewTab">平仓后复盘</a></li>
    </ul>

    <div class="tab-content">
        <div id="openingReasonTab" class="tab-pane fade in active">
            <h3>开仓原因</h3>
            <div id="openingReasonDisplay" class="analysis-display"></div>
            <div id="openingReasonEdit" class="analysis-edit">
                <textarea id="openingReasonText" class="form-control" rows="5"></textarea>
                <button class="btn btn-primary" onclick="saveAnalysis('openingReason')">保存</button>
                <button class="btn btn-default" onclick="cancelEdit('openingReason')">取消</button>
            </div>
            <button id="openingReasonEditBtn" class="btn btn-info" onclick="editAnalysis('openingReason')" style="display:none;">编辑</button>
        </div>

        <div id="holdingRecordTab" class="tab-pane fade">
            <h3>持仓时记录</h3>
            <div id="holdingRecordDisplay" class="analysis-display"></div>
            <div id="holdingRecordEdit" class="analysis-edit">
                <textarea id="holdingRecordText" class="form-control" rows="5"></textarea>
                <button class="btn btn-primary" onclick="saveAnalysis('holdingRecord')">保存</button>
                <button class="btn btn-default" onclick="cancelEdit('holdingRecord')">取消</button>
            </div>
            <button id="holdingRecordEditBtn" class="btn btn-info" onclick="editAnalysis('holdingRecord')" style="display:none;">编辑</button>
        </div>

        <div id="closingReviewTab" class="tab-pane fade">
            <h3>平仓后复盘</h3>
            <div id="closingReviewDisplay" class="analysis-display"></div>
            <div id="closingReviewEdit" class="analysis-edit">
                <textarea id="closingReviewText" class="form-control" rows="5"></textarea>
                <button class="btn btn-primary" onclick="saveAnalysis('closingReview')">保存</button>
                <button class="btn btn-default" onclick="cancelEdit('closingReview')">取消</button>
            </div>
            <button id="closingReviewEditBtn" class="btn btn-info" onclick="editAnalysis('closingReview')" style="display:none;">编辑</button>
        </div>
    </div>
</div>

<script>
    var apiGetMap = {
        openingReason: '/system/openingReason/getByPositionId',
        holdingRecord: '/system/holdingNotes/getByPositionId',
        closingReview: '/system/closingReview/getByPositionId'
    };

    var apiSaveMap = {
        openingReason: '/system/openingReason/edit',
        holdingRecord: '/system/holdingNotes/edit',
        closingReview: '/system/closingReview/edit'
    };

    function loadAnalysis(type) {
        var positionId = $('#positionId').val();
        $.get(apiGetMap[type], { positionId: positionId }, function(response) {
            if (response.code === 0 && response.data) {
                var content = response.data.content || '';
                $('#' + type + 'Display').text(content);
                if (content) {
                    $('#' + type + 'Edit').hide();
                    $('#' + type + 'EditBtn').show();
                } else {
                    editAnalysis(type);
                }
            } else {
                editAnalysis(type);
            }
        });
    }

    function editAnalysis(type) {
        $('#' + type + 'Display').hide();
        $('#' + type + 'Edit').show();
        $('#' + type + 'EditBtn').hide();
        $('#' + type + 'Text').val($('#' + type + 'Display').text());
    }

    function cancelEdit(type) {
        $('#' + type + 'Edit').hide();
        $('#' + type + 'Display').show();
        $('#' + type + 'EditBtn').show();
    }

    function saveAnalysis(type) {
        var positionId = $('#positionId').val();
        var data = { positionId: positionId, content: $('#' + type + 'Text').val() };

        $.ajax({
            type: 'POST',
            url: apiSaveMap[type],
            data: JSON.stringify(data),
            contentType: 'application/json',
            success: function(response) {
                if (response.code === 0) {
                    alert('保存成功！');
                    $('#' + type + 'Display').text($('#' + type + 'Text').val());
                    cancelEdit(type);
                } else {
                    alert('保存失败：' + response.msg);
                }
            },
            error: function() {
                alert('保存失败，请重试！');
            }
        });
    }

    $(document).ready(function() {
        loadAnalysis('openingReason');
        loadAnalysis('holdingRecord');
        loadAnalysis('closingReview');
    });
</script>
</body>
</html>
